name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.13
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --memory=2g
          --health-cmd="curl -fsS http://localhost:9200/_cluster/health"
          --health-interval=10s --health-timeout=5s --health-retries=20
    env:
      ANALYSIS_MODE: unlabeled
      VOICE_MODE: disabled
      DATA_MODE: fixture
      ELASTICSEARCH_URL: http://127.0.0.1:9200
      ELASTICSEARCH_INDEX: cua-parse-ci-evidence-v1
      APP_BASE_URL: http://127.0.0.1:3100
      PORT: 3100
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run secret-scan -- --history
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - name: Verify browser flow
        run: |
          npm start > .local/ci-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const response = await fetch(process.env.APP_BASE_URL + '/api/health');
              if ((await response.json()).ok) process.exit(0);
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          throw new Error('Local API did not become ready');
          JS
          npm run test:browser
